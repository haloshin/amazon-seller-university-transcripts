name: Validate transcripts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify.py
      - run: python3 scripts/build_reader.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node --check scripts/reader/app.js
