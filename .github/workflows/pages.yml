name: Publish HTML reader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify.py
      - run: python3 scripts/build_reader.py --check
      - run: python3 scripts/test_reader.py
      - uses: actions/configure-pages@v5
      - run: python3 scripts/stage_site.py --output "$RUNNER_TEMP/reader-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/reader-site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
