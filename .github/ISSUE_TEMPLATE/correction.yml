name: 转写与译文纠错 / Text correction
description: 提供原课程证据，帮助修正转写、中文译文或校注。
title: "[纠错] "
body:
  - type: input
    id: course
    attributes:
      label: 课程原标题或文件路径
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 语言与位置（译文可填段落）
      placeholder: "中文音轨 02:58–03:16；或中文译文第 3 段"
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 当前文字、建议更正与依据
      description: 请提供可核对的官方来源；不要上传账号信息或私密材料。
    validations:
      required: true
